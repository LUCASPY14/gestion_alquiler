name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gestion_alquiler
          POSTGRES_USER: alquiler_user
          POSTGRES_PASSWORD: alquiler_ci_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alquiler_user -d gestion_alquiler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-only-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://alquiler_user:alquiler_ci_pass@localhost:5432/gestion_alquiler

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Chequeos de Django
        working-directory: backend
        run: python manage.py check

      - name: Verificar que no falten migraciones
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Correr tests
        working-directory: backend
        run: python manage.py test alquiler

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
