services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestion_alquiler}
      POSTGRES_USER: ${POSTGRES_USER:-alquiler_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alquiler_dev_pass}
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-waha-dev-key}
      WHATSAPP_DEFAULT_ENGINE: WEBJS
    ports:
      - "3010:3000"
    volumes:
      - waha_sessions:/app/.sessions

volumes:
  pgdata:
  waha_sessions:
